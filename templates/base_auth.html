<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Treasury Flow{% endblock %}</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest_v4.json') }}">
    <meta name="theme-color" content="#11237e">
    <link rel="apple-touch-icon" href="/static/img/logo_v4.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block styles %}{% endblock %}
</head>
<body class="auth-body d-flex flex-column min-vh-100">
    <div class="flex-grow-1 d-flex flex-column justify-content-center">
        {% block content %}{% endblock %}
    </div>

    <!-- Watermark Footer -->
    <footer class="w-100 py-3 text-center mt-auto" style="position: relative; z-index: 10;">
        <p class="mb-0 small fw-medium text-white" style="letter-spacing: 2px; opacity: 0.6; text-transform: uppercase; font-size: 0.75rem;">Powered by Fernando Capital</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then((reg) => {
                    console.log('ServiceWorker registration successful with scope: ', reg.scope);
                }).catch((err) => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>

</body>
</html>
