{% extends 'base.html' %}
{% block title %}Financial Tools{% endblock %}
{% block content %}
<div class="max-w-5xl mx-auto">
    <h1 class="text-3xl font-bold text-white mb-6">Financial Tools & Calculators</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Compound Interest Calculator -->
        <div class="glass-card p-6">
            <h3 class="text-xl font-bold text-primary mb-4"><i class="fa-solid fa-chart-line mr-2"></i> Compound Interest</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Initial Investment (Rp)</label>
                    <input type="number" id="ci-initial" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-white" value="10000000">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Monthly Contribution (Rp)</label>
                    <input type="number" id="ci-monthly" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-white" value="1000000">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Annual Interest Rate (%)</label>
                    <input type="number" id="ci-rate" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-white" value="8">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Years to Grow</label>
                    <input type="number" id="ci-years" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-white" value="10">
                </div>
                <button onclick="calculateCI()" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-2 px-4 rounded transition-colors">Calculate</button>
                
                <div class="mt-4 p-4 bg-slate-900/80 rounded-lg border border-slate-700">
                    <p class="text-sm text-slate-400">Total Value in <span id="ci-res-years">10</span> Years:</p>
                    <p class="text-2xl font-bold text-green-400" id="ci-result">Rp 0</p>
                </div>
            </div>
        </div>

        <!-- Mortgage Calculator -->
        <div class="glass-card p-6">
            <h3 class="text-xl font-bold text-orange-500 mb-4"><i class="fa-solid fa-house mr-2"></i> Mortgage (KPR)</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Home Price (Rp)</label>
                    <input type="number" id="kpr-price" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-white" value="500000000">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Down Payment (Rp)</label>
                    <input type="number" id="kpr-dp" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-white" value="100000000">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Interest Rate (%)</label>
                    <input type="number" id="kpr-rate" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-white" value="6.5">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Loan Term (Years)</label>
                    <input type="number" id="kpr-years" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-2 text-white" value="15">
                </div>
                <button onclick="calculateKPR()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-4 rounded transition-colors">Calculate</button>
                
                <div class="mt-4 p-4 bg-slate-900/80 rounded-lg border border-slate-700">
                    <p class="text-sm text-slate-400">Monthly Payment:</p>
                    <p class="text-2xl font-bold text-red-400" id="kpr-result">Rp 0</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function formatRp(val) {
    return 'Rp ' + new Intl.NumberFormat('id-ID').format(Math.round(val));
}

function calculateCI() {
    let p = parseFloat(document.getElementById('ci-initial').value);
    let pmt = parseFloat(document.getElementById('ci-monthly').value);
    let r = parseFloat(document.getElementById('ci-rate').value) / 100 / 12;
    let t = parseFloat(document.getElementById('ci-years').value) * 12;
    
    let fv = p * Math.pow(1 + r, t) + pmt * ((Math.pow(1 + r, t) - 1) / r);
    document.getElementById('ci-res-years').innerText = document.getElementById('ci-years').value;
    document.getElementById('ci-result').innerText = formatRp(fv);
}

function calculateKPR() {
    let price = parseFloat(document.getElementById('kpr-price').value);
    let dp = parseFloat(document.getElementById('kpr-dp').value);
    let principal = price - dp;
    
    let r = parseFloat(document.getElementById('kpr-rate').value) / 100 / 12;
    let n = parseFloat(document.getElementById('kpr-years').value) * 12;
    
    let m = principal * (r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
    document.getElementById('kpr-result').innerText = formatRp(m);
}

// Calculate on load
calculateCI();
calculateKPR();
</script>
{% endblock %}
