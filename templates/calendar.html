{% extends 'base_shadcn.html' %}
{% block title %}Kalender Finansial - Treasury Flow{% endblock %}
{% block content %}
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>

<div class="max-w-6xl mx-auto space-y-6">
    <!-- Header with Legend -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-foreground flex items-center gap-2">
                <i data-lucide="calendar" class="w-7 h-7 text-[#11237e] dark:text-blue-400"></i>
                Kalender Finansial
            </h1>
            <p class="text-sm text-muted-foreground mt-1">Pantau seluruh jadwal jatuh tempo tagihan, cicilan, utang piutang, dan target tabungan Anda.</p>
        </div>
        
        <!-- Legend Badges -->
        <div class="flex flex-wrap items-center gap-2 text-xs font-semibold">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-600 dark:text-blue-400 border border-blue-500/20">
                <span class="w-2 h-2 rounded-full bg-blue-500"></span> Goal Tabungan
            </span>
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-purple-500/10 text-purple-600 dark:text-purple-400 border border-purple-500/20">
                <span class="w-2 h-2 rounded-full bg-purple-500"></span> Tagihan/Cicilan
            </span>
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Piutang
            </span>
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-destructive/10 text-destructive border border-destructive/20">
                <span class="w-2 h-2 rounded-full bg-destructive"></span> Utang
            </span>
        </div>
    </div>

    <!-- Calendar Card Container -->
    <div class="bg-card text-card-foreground border border-border rounded-2xl p-4 sm:p-6 shadow-sm overflow-hidden">
        <div id='calendar' class="min-h-[650px]"></div>
    </div>
</div>

<style>
    /* FullCalendar Theme Adaptations */
    .fc {
        font-family: inherit;
    }
    .fc-toolbar-title {
        font-size: 1.25rem !important;
        font-weight: 700 !important;
    }
    .fc-theme-standard td, .fc-theme-standard th {
        border-color: hsl(var(--border) / 0.6) !important;
    }
    .fc-theme-standard .fc-scrollgrid {
        border-color: hsl(var(--border) / 0.8) !important;
        border-radius: 0.75rem;
        overflow: hidden;
    }
    .fc-button-primary {
        background-color: #11237e !important;
        border-color: #11237e !important;
        border-radius: 0.5rem !important;
        font-weight: 600 !important;
        font-size: 0.875rem !important;
        padding: 0.4rem 0.8rem !important;
    }
    .dark .fc-button-primary {
        background-color: #3b82f6 !important;
        border-color: #3b82f6 !important;
        color: #ffffff !important;
    }
    .fc-daygrid-event {
        border-radius: 0.375rem !important;
        padding: 2px 4px !important;
        font-size: 0.75rem !important;
        font-weight: 500 !important;
        border: none !important;
    }
    .dark .fc-col-header-cell-cushion,
    .dark .fc-daygrid-day-number {
        color: hsl(var(--foreground) / 0.85);
    }
    .fc-col-header-cell-cushion {
        font-weight: 600;
        text-decoration: none !important;
        color: hsl(var(--foreground));
        padding: 8px 0 !important;
    }
    .fc-daygrid-day-number {
        text-decoration: none !important;
        font-weight: 500;
    }

    /* High-contrast "Today / Hari Ini" cell highlight */
    .fc .fc-daygrid-day.fc-day-today,
    .fc .fc-timegrid-col.fc-day-today,
    td.fc-day-today {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.16) 0%, rgba(59, 130, 246, 0.24) 100%) !important;
        box-shadow: inset 0 0 0 2.5px #2563eb !important;
        position: relative;
    }
    .dark .fc .fc-daygrid-day.fc-day-today,
    .dark .fc .fc-timegrid-col.fc-day-today,
    .dark td.fc-day-today {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.30) 0%, rgba(56, 189, 248, 0.22) 100%) !important;
        box-shadow: inset 0 0 0 2.5px #38bdf8 !important;
    }
    .fc .fc-daygrid-day.fc-day-today .fc-daygrid-day-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 6px 2px 6px;
    }
    .fc .fc-daygrid-day.fc-day-today .fc-daygrid-day-top::before {
        content: 'HARI INI';
        font-size: 0.625rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        padding: 2px 6px;
        border-radius: 9999px;
        background-color: #2563eb;
        color: #ffffff;
        box-shadow: 0 1px 3px rgba(37, 99, 235, 0.4);
    }
    .dark .fc .fc-daygrid-day.fc-day-today .fc-daygrid-day-top::before {
        background-color: #38bdf8;
        color: #0f172a;
        box-shadow: 0 1px 4px rgba(56, 189, 248, 0.5);
    }
    .fc .fc-daygrid-day.fc-day-today .fc-daygrid-day-number {
        background-color: #2563eb !important;
        color: #ffffff !important;
        font-weight: 800 !important;
        border-radius: 9999px !important;
        min-width: 1.75rem;
        height: 1.75rem;
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        padding: 0 0.4rem !important;
        box-shadow: 0 2px 6px rgba(37, 99, 235, 0.35);
    }
    .dark .fc .fc-daygrid-day.fc-day-today .fc-daygrid-day-number {
        background-color: #38bdf8 !important;
        color: #0f172a !important;
        box-shadow: 0 2px 6px rgba(56, 189, 248, 0.45);
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        if (calendarEl) {
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'id',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek'
                },
                buttonText: {
                    today: 'Hari Ini',
                    month: 'Bulan',
                    week: 'Minggu'
                },
                events: '/api/calendar_events',
                eventTimeFormat: {
                    hour: '2-digit',
                    minute: '2-digit',
                    meridiem: false
                }
            });
            calendar.render();
        }
        if (window.lucide) {
            lucide.createIcons();
        }
    });
</script>
{% endblock %}
