{% extends 'base_auth.html' %}
{% block title %}404 - Halaman Tidak Ditemukan{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 glass-card p-10 text-center relative overflow-hidden">
        
        <!-- Animated Background Element -->
        <div class="absolute -top-20 -right-20 w-40 h-40 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
        <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>

        <div class="relative z-10">
            <h1 class="text-9xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-600 drop-shadow-lg">
                404
            </h1>
            <h2 class="mt-6 text-3xl font-bold text-white tracking-tight">
                Oops! Nyasar ya?
            </h2>
            <p class="mt-4 text-slate-400">
                Halaman yang Anda cari sepertinya tidak ada di sistem kami. Mungkin URL-nya salah atau halamannya sudah dihapus.
            </p>
            
            <div class="mt-8 flex flex-col space-y-4">
                <a href="{{ url_for('dashboard.dashboard') }}" class="w-full flex items-center justify-center px-8 py-3 border border-transparent text-base font-medium rounded-xl text-white bg-primary hover:bg-blue-600 hover:shadow-lg hover:shadow-primary/30 transition-all duration-300 transform hover:-translate-y-1">
                    <i class="fa-solid fa-house mr-2"></i> Kembali ke Dashboard
                </a>
            </div>
        </div>
    </div>
</div>

<style>
@keyframes blob {
  0% { transform: translate(0px, 0px) scale(1); }
  33% { transform: translate(30px, -50px) scale(1.1); }
  66% { transform: translate(-20px, 20px) scale(0.9); }
  100% { transform: translate(0px, 0px) scale(1); }
}
.animate-blob { animation: blob 7s infinite; }
.animation-delay-2000 { animation-delay: 2s; }
</style>
{% endblock %}
