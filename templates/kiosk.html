<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasury Flow - Kiosk Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
          darkMode: 'class',
          theme: { extend: { colors: { primary: "hsl(221.2 83.2% 53.3%)" } } }
        }
    </script>
    <style>
        body { @apply bg-black text-white h-screen overflow-hidden flex flex-col; }
        .glass-panel { @apply bg-slate-900/40 border border-slate-800 rounded-2xl shadow-2xl; }
        .pulse-text { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; text-shadow: 0 0 10px rgba(59, 130, 246, 0.8); }
            100% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="flex justify-between items-center p-6 bg-gradient-to-b from-slate-900 to-transparent">
        <div class="text-3xl font-bold flex items-center gap-3">
            <i class="fa-solid fa-wallet text-blue-500"></i> TREASURY FLOW <span class="text-slate-500 text-lg">| KIOSK MODE</span>
        </div>
        <div class="text-right">
            <div id="clock" class="text-4xl font-mono font-bold pulse-text">00:00:00</div>
            <div id="date" class="text-slate-400">Loading...</div>
        </div>
    </div>
    
    <div class="flex-1 grid grid-cols-2 gap-8 p-8">
        <div class="glass-panel p-6 flex flex-col justify-center items-center relative">
            <h2 class="absolute top-6 left-6 text-xl font-semibold text-slate-400 uppercase tracking-wider">Future AI Prediction</h2>
            <div class="w-full h-full pt-12">
                <canvas id="kioskChart"></canvas>
            </div>
        </div>
        
        <div class="grid grid-rows-2 gap-8">
            <div class="glass-panel p-8 flex flex-col justify-center bg-gradient-to-br from-blue-900/20 to-purple-900/20">
                <h2 class="text-xl font-semibold text-slate-400 uppercase tracking-wider mb-2">Network Status</h2>
                <div class="text-5xl font-bold text-green-400 mb-4">SYSTEM ONLINE</div>
                <p class="text-slate-400">Telemetry: <span class="text-white">Active</span></p>
                <p class="text-slate-400">AI Engine: <span class="text-white">Standby</span></p>
            </div>
            
            <div class="glass-panel p-8 flex flex-col justify-center relative overflow-hidden">
                <div class="absolute -right-10 -bottom-10 opacity-10">
                    <i class="fa-solid fa-globe text-9xl"></i>
                </div>
                <h2 class="text-xl font-semibold text-slate-400 uppercase tracking-wider mb-2">Active User</h2>
                <div class="text-4xl font-bold text-white mb-2">{{ session.get('username') }}</div>
                <a href="{{ url_for('dashboard.dashboard') }}" class="mt-4 text-blue-400 hover:text-blue-300 z-10 w-fit">
                    <i class="fa-solid fa-arrow-left mr-2"></i> Exit Kiosk Mode
                </a>
            </div>
        </div>
    </div>

    <script>
        // Clock
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('id-ID');
            document.getElementById('date').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(updateTime, 1000);
        updateTime();
        
        // Fetch AI Prediction Data
        fetch('/api/predict_future')
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    const ctx = document.getElementById('kioskChart').getContext('2d');
                    new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: data.predictions.map(d => d.date),
                            datasets: [{
                                label: 'Predicted Expenses',
                                data: data.predictions.map(d => d.predicted_expense),
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.2)',
                                borderWidth: 3,
                                fill: true,
                                tension: 0.4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                                x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
                            },
                            plugins: {
                                legend: { labels: { color: '#fff' } }
                            }
                        }
                    });
                }
            });
    </script>
</body>
</html>
