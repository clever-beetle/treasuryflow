<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Treasury Flow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body { background-color: #f8faff; color: #333; }
        .navbar { background-color: #ffffff !important; border-bottom: 1px solid #e0e0e0; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); }
        .form-control-custom { background-color: #f1f1f1; border: none; border-radius: 10px; padding: 12px; }
        .nav-pills .nav-link { color: #666; border-radius: 10px; margin-bottom: 5px; }
        .nav-pills .nav-link.active { background-color: #007bff; color: white; }
        .btn-save { background-color: #007bff; color: white; border-radius: 10px; padding: 10px 20px; font-weight: 600; border: none; }
        .footer-branding { font-size: 0.8rem; color: #ccc; margin-top: 50px; text-align: center; padding-bottom: 20px; }
        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; color: #444; }
    </style>
</head>
<body>

        <nav class="navbar bg-white border-bottom p-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">TREASURY FLOW</a>
        
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar">
            <i class="fas fa-bars fa-lg"></i>
            </button>
        
            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
                <div class="offcanvas-header border-bottom">
                    <h5 class="offcanvas-title fw-bold" id="offcanvasNavbarLabel text-primary">MENU UTAMA</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1">
                        <li class="nav-item mb-2">
                            <a class="nav-link p-3 rounded {{ 'active bg-light fw-bold' if request.endpoint == 'dashboard' }}" href="{{ url_for('dashboard') }}">
                                <i class="fas fa-home me-3 text-primary"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link p-3 rounded {{ 'active bg-light fw-bold' if request.endpoint == 'setup_account' }}" href="{{ url_for('setup_account') }}">
                                <i class="fas fa-wallet me-3 text-success"></i> Kelola Accounts
                            </a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link p-3 rounded {{ 'active bg-light fw-bold' if request.endpoint == 'transactions_list' }}" href="{{ url_for('transactions_list') }}">
                                <i class="fas fa-list me-3 text-info"></i> Riwayat Transaksi
                            </a>
                        </li>
                        <li class="nav-item mb-2">
                            <a class="nav-link p-3 rounded {{ 'active bg-light fw-bold' if request.endpoint == 'settings' }}" href="{{ url_for('settings') }}">
                                <i class="fas fa-user-cog me-3 text-secondary"></i> Pengaturan Akun
                            </a>
                        </li>
                    
                        <hr class="my-4">
                    
                        <li class="nav-item">
                            <button type="button" class="btn btn-danger w-100 p-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#logoutModal" style="border-radius: 12px;">
                                <i class="fas fa-sign-out-alt me-2"></i> Keluar Aplikasi
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4"><i class="fas fa-user-cog me-2"></i> Pengaturan Akun</h2>

        {% if message %}
            <div class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle me-2"></i> {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endif %}
        {% if error %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i> {{ error }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endif %}

        <div class="row">
            <div class="col-md-4">
                <div class="card p-3 mb-4">
                    <div class="nav flex-column nav-pills" id="v-pills-tab" role="tablist" aria-orientation="vertical">
                        <button class="nav-link active text-start" id="profile-tab" data-bs-toggle="pill" data-bs-target="#profile" type="button" role="tab"><i class="fas fa-user me-2"></i> Profil Dasar</button>
                        <button class="nav-link text-start" id="security-tab" data-bs-toggle="pill" data-bs-target="#security" type="button" role="tab"><i class="fas fa-shield-alt me-2"></i> Keamanan</button>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="tab-content" id="v-pills-tabContent">
                    
                    <div class="tab-pane fade show active" id="profile" role="tabpanel">
                        <div class="card p-4">
                            <div class="section-title">Informasi Profil</div>
                            
                            <form method="POST" class="mb-4">
                                <input type="hidden" name="action" value="update_fullname">
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Nama Lengkap</label>
                                    <input type="text" name="fullname" class="form-control form-control-custom" value="{{ user.fullname }}" required>
                                </div>
                                <button type="submit" class="btn btn-save">Simpan Perubahan</button>
                            </form>

                            <hr>

                            <form method="POST">
                                <input type="hidden" name="action" value="update_username">
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Username</label>
                                    <input type="text" name="username" class="form-control form-control-custom" value="{{ user.username }}" required>
                                </div>
                                <button type="submit" class="btn btn-save">Ganti Username</button>
                            </form>
                        </div>
                    </div>

                    <div class="tab-pane fade" id="security" role="tabpanel">
                        <div class="card p-4">
                            <div class="section-title">Ganti Password</div>
                            <form method="POST">
                                <input type="hidden" name="action" value="update_password">
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Password Lama</label>
                                    <input type="password" name="old_password" class="form-control form-control-custom" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Password Baru</label>
                                    <input type="password" name="new_password" class="form-control form-control-custom" required>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label small fw-bold">Konfirmasi Password Baru</label>
                                    <input type="password" name="confirm_password" class="form-control form-control-custom" required>
                                </div>
                                <button type="submit" class="btn btn-danger shadow-sm" style="border-radius: 10px; padding: 10px 20px;">Update Password</button>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div class="footer-branding">
        Powered by <strong>Fernando Capital</strong>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
