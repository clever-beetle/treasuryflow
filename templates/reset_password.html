<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Treasury Flow</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#11237e">
    <link rel="apple-touch-icon" href="/static/img/logo_v4.png">

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo_v4.png') }}">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        border: "hsl(var(--border))", input: "hsl(var(--input))", ring: "hsl(var(--ring))",
                        background: "hsl(var(--background))", foreground: "hsl(var(--foreground))",
                        primary: { DEFAULT: "hsl(var(--primary))", foreground: "hsl(var(--primary-foreground))" },
                        secondary: { DEFAULT: "hsl(var(--secondary))", foreground: "hsl(var(--secondary-foreground))" },
                        destructive: { DEFAULT: "hsl(var(--destructive))", foreground: "hsl(var(--destructive-foreground))" },
                        muted: { DEFAULT: "hsl(var(--muted))", foreground: "hsl(var(--muted-foreground))" },
                        accent: { DEFAULT: "hsl(var(--accent))", foreground: "hsl(var(--accent-foreground))" },
                        card: { DEFAULT: "hsl(var(--card))", foreground: "hsl(var(--card-foreground))" },
                    },
                    borderRadius: { lg: "var(--radius)", md: "calc(var(--radius) - 2px)", sm: "calc(var(--radius) - 4px)" },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        :root {
            --background: 210 40% 98%; --foreground: 222.2 84% 4.9%;
            --card: 0 0% 100%; --card-foreground: 222.2 84% 4.9%;
            --primary: 222.2 47.4% 11.2%; --primary-foreground: 210 40% 98%;
            --secondary: 210 40% 96.1%; --secondary-foreground: 222.2 47.4% 11.2%;
            --muted: 210 40% 96.1%; --muted-foreground: 215.4 16.3% 46.9%;
            --accent: 210 40% 96.1%; --accent-foreground: 222.2 47.4% 11.2%;
            --destructive: 0 84.2% 60.2%; --destructive-foreground: 210 40% 98%;
            --border: 214.3 31.8% 91.4%; --input: 214.3 31.8% 91.4%;
            --ring: 222.2 84% 4.9%; --radius: 0.75rem;
        }
        .dark {
            --background: 222.2 84% 4.9%; --foreground: 210 40% 98%;
            --card: 222.2 84% 4.9%; --card-foreground: 210 40% 98%;
            --primary: 210 40% 98%; --primary-foreground: 222.2 47.4% 11.2%;
            --secondary: 217.2 32.6% 17.5%; --secondary-foreground: 210 40% 98%;
            --muted: 217.2 32.6% 17.5%; --muted-foreground: 215 20.2% 65.1%;
            --accent: 217.2 32.6% 17.5%; --accent-foreground: 210 40% 98%;
            --destructive: 0 62.8% 30.6%; --destructive-foreground: 210 40% 98%;
            --border: 217.2 32.6% 17.5%; --input: 217.2 32.6% 17.5%; --ring: 212.7 26.8% 83.9%;
        }
        body { font-family: 'Inter', sans-serif; background-color: hsl(var(--background)); color: hsl(var(--foreground)); }
    </style>
    <script>
        (function(){
            var s = localStorage.getItem('theme') || 'light';
            if (s === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
</head>
<body class="bg-muted flex items-center justify-center min-h-screen p-4 sm:p-8 relative" x-data="{ darkMode: localStorage.getItem('theme') === 'dark', showPass: false }" x-init="$watch('darkMode', val => { localStorage.setItem('theme', val ? 'dark' : 'light'); if(val) document.documentElement.classList.add('dark'); else document.documentElement.classList.remove('dark'); })">
    
    <button @click="darkMode = !darkMode" class="absolute top-4 right-4 p-2 rounded-full bg-card border border-border text-foreground hover:bg-accent hover:text-accent-foreground transition-transform hover:scale-110 active:scale-90 z-50">
        <i data-lucide="moon" x-show="!darkMode" class="h-5 w-5"></i>
        <i data-lucide="sun" x-show="darkMode" class="h-5 w-5"></i>
    </button>

    <div class="w-full max-w-md bg-card text-card-foreground rounded-2xl border border-border shadow-xl p-8 animate-in fade-in zoom-in duration-300">
        <div class="flex justify-center mb-6">
            <img src="{{ url_for('static', filename='img/logo_v4.png') }}" alt="Logo" class="h-16 w-auto object-contain">
        </div>
        <h1 class="text-2xl font-bold text-center mb-2">Reset Password</h1>
        <p class="text-muted-foreground text-center text-sm mb-6">Enter your new password below</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 p-4 rounded-lg flex items-center gap-3 border {% if category == 'success' %}bg-green-100 text-green-800 border-green-200 dark:bg-green-900/30 dark:text-green-400 dark:border-green-800{% else %}bg-red-100 text-red-800 border-red-200 dark:bg-red-900/30 dark:text-red-400 dark:border-red-800{% endif %}">
                        <i data-lucide="{% if category == 'success' %}check-circle{% else %}alert-circle{% endif %}" class="h-5 w-5"></i>
                        <span class="text-sm font-medium">{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        {% if error %}
            <div class="mb-4 p-4 rounded-lg flex items-center gap-3 border bg-red-100 text-red-800 border-red-200 dark:bg-red-900/30 dark:text-red-400 dark:border-red-800">
                <i data-lucide="alert-circle" class="h-5 w-5"></i>
                <span class="text-sm font-medium">{{ error }}</span>
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="space-y-2">
                <label for="password" class="text-sm font-medium leading-none">New Password</label>
                <div class="relative">
                    <input :type="showPass ? 'text' : 'password'" id="password" name="password" class="flex h-10 w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2" placeholder="Enter new password" required>
                    <button type="button" @click="showPass = !showPass" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground">
                        <i data-lucide="eye" x-show="!showPass" class="h-4 w-4"></i>
                        <i data-lucide="eye-off" x-show="showPass" class="h-4 w-4"></i>
                    </button>
                </div>
            </div>
            <div class="space-y-2">
                <label for="confirm_password" class="text-sm font-medium leading-none">Confirm Password</label>
                <div class="relative">
                    <input :type="showPass ? 'text' : 'password'" id="confirm_password" name="confirm_password" class="flex h-10 w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm ring-offset-background placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2" placeholder="Confirm new password" required>
                </div>
            </div>
            <button type="submit" class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2 w-full mt-2">
                Update Password
            </button>
        </form>

    </div>
    <script>
        lucide.createIcons();
    </script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then((reg) => {
                    console.log('ServiceWorker registration successful with scope: ', reg.scope);
                }).catch((err) => {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>

</body>
</html>
