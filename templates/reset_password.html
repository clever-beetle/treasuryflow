<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Treasury Flow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            background-color: #f5f5f5;
            color: #111827;
            font-family: 'Inter', sans-serif;
        }
        .auth-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            background-color: #ffffff;
        }
        .form-control-custom {
            background-color: #f9fafb;
            padding: 12px 15px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            transition: all 0.2s ease-in-out;
        }
        .form-control-custom:focus {
            background-color: #ffffff;
            border-color: #11237e;
            box-shadow: 0 0 0 4px rgba(17, 35, 126, 0.05);
            outline: none;
        }
        .btn-navy {
            background-color: #11237e;
            color: white;
            border-radius: 10px;
            font-weight: 600;
            border: 2px solid #11237e;
            transition: all 0.2s ease-in-out;
        }
        .btn-navy:hover {
            background-color: #ffffff;
            color: #11237e;
        }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-5">
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} border-0 shadow-sm mb-3" style="border-radius: 10px;">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div class="card auth-card p-4">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold" style="color: #11237e;">Reset Password</h3>
                        <p class="text-muted small">Please create a strong new password for your account.</p>
                    </div>

                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">New Password</label>
                            <input type="password" name="password" class="form-control form-control-custom" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary">Confirm New Password</label>
                            <input type="password" name="confirm_password" class="form-control form-control-custom" required>
                        </div>

                        <button type="submit" class="btn btn-navy w-100 py-2.5">Update Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
