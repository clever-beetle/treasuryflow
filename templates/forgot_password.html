<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Treasury Flow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        body {
            background-image: url('https://picsum.photos/1920/1080?grayscale&blur=2'); 
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            -webkit-user-select: none; -ms-user-select: none; user-select: none;
        }

        .auth-card {
            background: rgba(255, 255, 255, 1);
            border-radius: 40px; 
            padding: 40px 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px; 
        }
        
        .form-control-custom {
            background-color: #f5f5f5;
            border: 1px solid transparent;
            color: #111827;
            padding: 12px 15px;
            height: auto;
            transition: all 0.2s ease-in-out;
            border-radius: 10px !important; 
        }

        .form-control-custom:focus {
            background-color: #ffffff;
            border-color: #11237e;
            box-shadow: 0 0 0 4px rgba(17, 35, 126, 0.05);
            outline: none;
            color: #111827;
        }
        
        .btn-main {
            background-color: #11237e;
            color: #ffffff;
            border: 2px solid #11237e;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
        }

        .btn-main:hover {
            background-color: #ffffff;
            color: #11237e;
        }

        .btn-secondary-custom {
            background-color: #f5f5f5;
            color: #6c757d;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
            display: block;
            text-align: center;
            text-decoration: none;
        }

        .btn-secondary-custom:hover {
            background-color: #e2e8f0;
            color: #4b5563;
        }

        .separator {
            display: flex;
            align-items: center;
            text-align: center;
            color: #6c757d;
            margin: 20px 0;
        }
        .separator::before, .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #dee2e6;
        }
        .separator:not(:empty)::before { margin-right: .5em; }
        .separator:not(:empty)::after { margin-left: .5em; }
        
        .powered-by {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #6c757d;
        }

        .auth-logo {
            height: 150px; 
            width: auto;
            display: block;
            margin: -40px auto 5px auto; 
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Treasury Flow" class="auth-logo">
            <h1 style="font-weight: 900; letter-spacing: 2px; margin-top: 10px; color: #11237e;">TREASURY FLOW</h1>
            <p class="text-muted small mt-2 fw-semibold">Enter your email to receive a reset link</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} border-0 shadow-sm" role="alert" style="border-radius: 10px;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-4">
                <input type="email" id="username" name="username" class="form-control form-control-custom fw-semibold" placeholder="Email Address" required>
            </div>

            <button type="submit" class="btn btn-main w-100">Send Reset Link</button>
        </form>
        
        <div class="separator">Or</div>

        <a href="{{ url_for('login') }}" class="btn btn-secondary-custom w-100">Back to Log In</a>

        <div class="powered-by">
            Powered by <strong>Fernando Capital</strong>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        (function() {
            function hackerTrap(index) {
                function preventInspect(i) {
                    if (typeof i === 'string') {
                        return function() {}.constructor('while (true) {}').apply('counter');
                    } else if (('' + i / i).length !== 1 || i % 20 === 0) {
                        (function() { return true; }).constructor('debugger').call('action');
                    } else {
                        (function() { return false; }).constructor('debugger').apply('state');
                    }
                    preventInspect(++i);
                }
                try {
                    if (index) {
                        return preventInspect(index);
                    } else {
                        preventInspect(0);
                    }
                } catch (e) {}
            }
            setInterval(function() {
                hackerTrap();
            }, 100);
        })();

        document.addEventListener('contextmenu', function(e) {
            if (e.target.tagName === 'BODY' || e.target.classList.contains('container') || e.target.closest('.row')) {
                e.preventDefault();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.keyCode === 123) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.keyCode === 85) { e.preventDefault(); return false; }
        });
    </script>
</body>
</html>
