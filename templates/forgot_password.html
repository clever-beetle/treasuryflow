<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Lupa Password - Treasury Flow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card p-4 mx-auto shadow-sm" style="max-width: 400px; border-radius: 15px;">
        <h4 class="text-center mb-4">Reset Password</h4>
        <form method="POST">
            <div class="mb-3">
                <label class="small text-muted">Username Anda</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="small text-muted">Siapa nama hewan peliharaan pertama Anda? (Jawaban Keamanan)</label>
                <input type="text" name="security_answer" class="form-control" placeholder="Jawaban rahasia" required>
            </div>
            <div class="mb-4">
                <label class="small text-muted">Password Baru</label>
                <input type="password" name="new_password" class="form-control" required>
            </div>
            <button class="btn btn-primary w-100 py-2 fw-bold">Update Password</button>
            <div class="text-center mt-3">
                <a href="/login" class="text-decoration-none small">Kembali ke Login</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
