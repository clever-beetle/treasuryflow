name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    # Step 1: Validate Python syntax
    - name: 🔍 Python Syntax Check
      run: |
        python -m py_compile app.py
        python -m py_compile utils.py
        python -m py_compile models.py
        for f in routes/*.py; do python -m py_compile "$f"; done
        echo "✅ All Python files OK"

    # Step 2: Template validation
    - name: 🔍 Template Validation
      run: python autofix.py

    # Step 3: Auto deploy to production branch
    - name: 🚀 Auto Push to Production
      run: |
        git config user.name "Deploy Bot"
        git config user.email "deploy@treasuryflow.web.id"
        git checkout -B production
        git push origin production --force
        echo "✅ Deployed to production"
