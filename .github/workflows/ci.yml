name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 1. Python syntax check - catches import errors, syntax errors
    - name: Python Syntax Check
      run: |
        python -m py_compile app.py
        python -m py_compile utils.py
        python -m py_compile models.py
        for f in routes/*.py; do python -m py_compile "$f"; done
        echo "✅ All Python files compile OK"

    # 2. Jinja2 template validation - catches broken templates
    - name: Template Validation
      run: |
        python -c "
        import os, re, sys
        errors = []
        for f in os.listdir('templates'):
            if not f.endswith('.html'): continue
            path = os.path.join('templates', f)
            content = open(path, encoding='utf-8').read()
            
            # Check mismatched quotes in @click attributes
            for i, line in enumerate(content.split('\n'), 1):
                # Find @click=\"...\" where tojson is used (should use single quotes outside)
                if '@click=\"' in line and 'tojson' in line:
                    errors.append(f'{path}:{i} - @click uses double quotes with tojson (will break HTML)')
                
                # Check unclosed Jinja2 blocks
                opens = line.count('{%') + line.count('{{')
                closes = line.count('%}') + line.count('}}')
                if opens != closes and '{#' not in line:
                    # Could be multi-line, skip
                    pass
            
            # Check block/endblock balance
            blocks = len(re.findall(r'{%[-\s]*block\s', content))
            endblocks = len(re.findall(r'{%[-\s]*endblock', content))
            if blocks != endblocks:
                errors.append(f'{path} - Mismatched block/endblock ({blocks} vs {endblocks})')
            
            # Check for/endfor balance
            fors = len(re.findall(r'{%[-\s]*for\s', content))
            endfors = len(re.findall(r'{%[-\s]*endfor', content))
            if fors != endfors:
                errors.append(f'{path} - Mismatched for/endfor ({fors} vs {endfors})')
            
            # Check if/endif balance
            ifs = len(re.findall(r'{%[-\s]*if\s', content))
            endifs = len(re.findall(r'{%[-\s]*endif', content))
            if ifs != endifs:
                errors.append(f'{path} - Mismatched if/endif ({ifs} vs {endifs})')
        
        if errors:
            print('❌ Template errors found:')
            for e in errors:
                print(f'  {e}')
            sys.exit(1)
        else:
            print('✅ All templates validated OK')
        "

    # 3. Flask app import test - catches runtime import errors
    - name: App Import Test
      run: |
        python -c "
        import os
        os.environ['SECRET_KEY'] = 'test'
        os.environ['DATABASE_URL'] = 'sqlite:///test.db'
        try:
            import app
            print('✅ App imports OK')
        except Exception as e:
            print(f'❌ App import failed: {e}')
            exit(1)
        "

  # Only deploy if validation passes
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Push to production branch
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git checkout -B production
        git push origin production --force
        echo "✅ Deployed to production branch"
