name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: finance_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        playwright install --with-deps
        
    - name: Initialize Database
      run: |
        python -c "from app import db; db.create_all()"
      env:
        DATABASE_URL: postgresql://user:password@localhost:5432/finance_tracker_test
        
    - name: Start Flask App
      run: |
        flask run -p 5000 &
        sleep 5
      env:
        FLASK_APP: app.py
        FLASK_ENV: testing
        SECRET_KEY: testing-secret
        DATABASE_URL: postgresql://user:password@localhost:5432/finance_tracker_test
        
    - name: Run Pytest Backend Tests
      run: |
        pytest tests/ -k "not e2e"
        
    - name: Run Playwright E2E and Visual Tests
      run: |
        pytest tests/e2e/
        
    - name: Upload Playwright Report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
